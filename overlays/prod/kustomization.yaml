apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - namespace.yaml

patches:
  - path: patches/replicas.yaml
    target:
      kind: Deployment
  - path: patches/resources.yaml
    target:
      kind: Deployment
  - path: patches/keyvault-prod.yaml
    target:
      kind: SecretProviderClass
      name: azure-kvname
  - path: patches/ingress-prod.yaml

commonLabels:
  environment: prod

images:
  - name: myplatformacr.azurecr.io/api-service
    newTag: prod-v1.0.0
  - name: myplatformacr.azurecr.io/auth-service
    newTag: prod-v1.0.0
  - name: myplatformacr.azurecr.io/worker-service
    newTag: prod-v1.0.0
