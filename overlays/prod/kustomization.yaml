apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - namespace.yaml
  - patches/keyvault-prod.yaml
  - patches/ingress-prod.yaml

namespace: prod

patches:
  - path: patches/replicas.yaml
  - path: patches/resources.yaml

labels:
  - pairs:
      environment: prod

images:
  - name: myplatformacr.azurecr.io/api-service
    newTag: prod-v1.0.0
  - name: myplatformacr.azurecr.io/auth-service
    newTag: prod-v1.0.0
  - name: myplatformacr.azurecr.io/worker-service
    newTag: prod-v1.0.0
